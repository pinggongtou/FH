                    const status = getStatus(car.brand, car.name);
                    if (currentFilter === 'all') return true;
                    return status === currentFilter;
                });

                const grouped = {};
                filtered.forEach(car => {
                    if (!grouped[car.brand]) grouped[car.brand] = [];
                    grouped[car.brand].push(car);
                });
                const sortedBrands = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'zh'));

                allCars.forEach(car => {
                    const st = getStatus(car.brand, car.name);
                    if (st === 'collected') stats.collected++;
                    else stats.none++;
                    totalCars++;
                });

                document.getElementById('totalCount').textContent = totalCars;
                document.getElementById('statNone').textContent = stats.none;
                document.getElementById('statCollected').textContent = stats.collected;

                if (sortedBrands.length === 0) {
                    container.innerHTML = `<div class="empty-msg">🚫 没有匹配的车辆</div>`;
                    return;
                }

                sortedBrands.forEach(brand => {
                    const cars = grouped[brand];
                    const card = document.createElement('div');
                    card.className = 'brand-card';

                    const header = document.createElement('div');
                    header.className = 'brand-header';
                    header.innerHTML = `<span>${brand}</span><span class="badge">${cars.length}</span>`;
                    card.appendChild(header);

                    const list = document.createElement('div');
                    list.className = 'car-list';

                    cars.sort((a, b) => {
                        const ya = parseInt(a.name.match(/^(\d{4})/)?.[1] || '0');
                        const yb = parseInt(b.name.match(/^(\d{4})/)?.[1] || '0');
                        return ya - yb;
                    });

                    cars.forEach(car => {
                        const status = getStatus(car.brand, car.name);
                        const yearMatch = car.name.match(/^(\d{4})/);
                        const year = yearMatch ? yearMatch[1] : '';
                        const nameDisplay = car.name.replace(/^\d{4}\s*/, '');

                        const item = document.createElement('div');
                        item.className = 'car-item';
                        const rarityColors = {
                            '普通': '#8edb9e',
                            '稀有': '#7ab8e8',
                            '史诗': '#b88ad4',
                            '极限竞速特别版': '#7a4a9a',
                            '传奇': '#e8c84a',
                            '车房宝物': '#b8943a'
                        };
                        item.style.borderLeftColor = rarityColors[car.rarity] || '#dce1e8';

                        const statusLabel = status === 'collected' ? '✅ 已收集' : '⬜ 未收集';
                        const statusClass = status === 'collected' ? 'tag-status-collected' : 'tag-status-none';

                        item.innerHTML = `
                        <span class="name">
                            ${year ? `<span class="year">${year}</span>` : ''}
                            ${nameDisplay}
                        </span>
                        <div class="car-tags">
                            <span class="tag tag-rarity-${car.rarity}">${car.rarity}</span>
                            <span class="tag tag-status ${statusClass}" data-brand="${car.brand}" data-model="${car.name}">${statusLabel}</span>
                        </div>
                    `;

                        const statusTag = item.querySelector('.tag-status');
                        statusTag.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleStatus(car.brand, car.name);
                        });

                        list.appendChild(item);
                    });

                    card.appendChild(list);
                    container.appendChild(card);
                });
            }

            // ============================================================
            //  渲染：车辆选择页面 + 扩大功能
            // ============================================================
            const CATEGORIES = ['公路', '拉力', '越野', '漂移'];
            const LEVELS = ['R', 'S2', 'S1', 'A', 'B', 'C', 'D'];
            const LEVEL_NAMES = { 'R': 'R 级', 'S2': 'S2 级', 'S1': 'S1 级', 'A': 'A 级', 'B': 'B 级', 'C': 'C 级',
                'D': 'D 级' };
            const CAT_ICONS = { '公路': '🏁', '拉力': '🏔️', '越野': '🌲', '漂移': '🌀' };
            const CAT_COLORS = { '公路': 'cat-公路', '拉力': 'cat-拉力', '越野': 'cat-越野', '漂移': 'cat-漂移' };
            const DRIVE_ICONS = { '四驱': '🔵', '前驱': '🟡', '后驱': '🔴' };

            let categoryFilter = 'all';
            let levelFilter = 'all';
            let driveFilter = 'all';
            let metaFilter = 'all';
            let highlightFilter = 'all';
            let isEditMode = false;
            let expandedCategory = null;

            let dragState = null;

            // ===== 拖动事件 =====
            function onDragStart(e) {
                const el = e.currentTarget;
                const brand = el.dataset.brand;
                const model = el.dataset.model;
                const level = el.dataset.level;
                const category = el.dataset.category;

                const indices = [];
                selectEntries.forEach((entry, i) => {
                    if (entry.level === level && entry.category === category) {
                        indices.push(i);
                    }
                });
                
                let realIdx = -1;
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i];
                    if (selectEntries[idx].brand === brand && 
                        selectEntries[idx].model === model &&
                        selectEntries[idx].level === level && 
                        selectEntries[idx].category === category) {
                        realIdx = i;
                        break;
                    }
                }

                dragState = {
                    element: el,
                    fromIndex: realIdx,
                    level: level,
                    category: category,
                    brand: brand,
                    model: model
                };
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify({
                    brand,
                    model,
                    level,
                    category
                }));
                document.querySelectorAll('.select-car-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            }

            function onDragEnd(e) {
                const el = e.currentTarget;
                el.classList.remove('dragging');
                document.querySelectorAll('.select-car-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                dragState = null;
            }

            function onDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const el = e.currentTarget;
                if (dragState && dragState.element === el) return;
                if (dragState) {
                    const targetLevel = el.dataset.level;
                    const targetCategory = el.dataset.category;
                    if (targetLevel !== dragState.level || targetCategory !== dragState.category) {
                        el.classList.remove('drag-over');
                        return;
                    }
                }
                el.classList.add('drag-over');
            }

            function onDragEnter(e) {
                e.preventDefault();
                const el = e.currentTarget;
                if (dragState && dragState.element === el) return;
                if (dragState) {
                    const targetLevel = el.dataset.level;
                    const targetCategory = el.dataset.category;
                    if (targetLevel !== dragState.level || targetCategory !== dragState.category) {
                        el.classList.remove('drag-over');
                        return;
                    }
                }
                el.classList.add('drag-over');
            }

            function onDragLeave(e) {
                const el = e.currentTarget;
                const related = e.relatedTarget;
                if (related && el.contains(related)) return;
                el.classList.remove('drag-over');
            }

            function onDrop(e) {
                e.preventDefault();
                const targetEl = e.currentTarget;
                targetEl.classList.remove('drag-over');

                if (!dragState || dragState.element === targetEl) {
                    dragState = null;
                    return;
                }

                const targetLevel = targetEl.dataset.level;
                const targetCategory = targetEl.dataset.category;

                if (targetLevel !== dragState.level || targetCategory !== dragState.category) {
                    showToast('⚠️ 只能在同一分类内拖动排序', 'error');
                    dragState = null;
                    return;
                }

                const indices = [];
                selectEntries.forEach((e, i) => {
                    if (e.level === targetLevel && e.category === targetCategory) {
                        indices.push(i);
                    }
                });

                let targetIdx = -1;
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i];
                    if (selectEntries[idx].brand === targetEl.dataset.brand && 
                        selectEntries[idx].model === targetEl.dataset.model &&
                        selectEntries[idx].level === targetLevel && 
                        selectEntries[idx].category === targetCategory) {
                        targetIdx = i;
                        break;
                    }
                }

                const fromIdx = dragState.fromIndex;
                const toIdx = targetIdx;

                if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) {
                    dragState = null;
                    return;
                }

                const fromRealIdx = indices[fromIdx];
                const toRealIdx = indices[toIdx];

                if (fromRealIdx === undefined || toRealIdx === undefined) {
                    dragState = null;
                    return;
                }

                const [moved] = selectEntries.splice(fromRealIdx, 1);
                
                let newToIdx = toRealIdx;
                if (fromRealIdx < toRealIdx) {
                    newToIdx = toRealIdx - 1;
                }
                
                selectEntries.splice(newToIdx, 0, moved);
                
                saveSelect();
                renderSelect();
                showToast('✅ 已调整顺序', 'success');
                dragState = null;
            }

            // ===== 扩大/收起（关闭无动画） =====
            function toggleExpand(category) {
                const overlay = document.getElementById('expandOverlay');
                const cards = document.querySelectorAll('.category-card');
                
                if (expandedCategory === category) {
                    // 关闭 - 无动画，直接消失
                    cards.forEach(card => {
                        card.classList.remove('expanded');
                    });
                    overlay.classList.remove('show');
                    expandedCategory = null;
                    document.body.style.overflow = '';
                    return;
                }

                // 展开 - 有动画
                cards.forEach(card => {
                    card.classList.remove('expanded');
                    const header = card.querySelector('.category-header');
                    if (header && header.textContent.includes(category)) {
                        card.classList.add('expanded');
                    }
                });
                overlay.classList.add('show');
                expandedCategory = category;
                document.body.style.overflow = 'hidden';
            }

            // 点击透明遮罩收起（无动画）
            document.getElementById('expandOverlay').addEventListener('click', function() {
                if (expandedCategory) {
                    const cards = document.querySelectorAll('.category-card');
                    cards.forEach(card => {
                        card.classList.remove('expanded');
                    });
                    this.classList.remove('show');
                    expandedCategory = null;
                    document.body.style.overflow = '';
                }
            });

            // ESC 键收起（无动画）
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && expandedCategory) {
                    const cards = document.querySelectorAll('.category-card');
                    cards.forEach(card => {
                        card.classList.remove('expanded');
                    });
                    document.getElementById('expandOverlay').classList.remove('show');
                    expandedCategory = null;
                    document.body.style.overflow = '';
                }
            });

            function renderSelect() {
                const container = document.getElementById('selectContainer');
                container.innerHTML = '';

                const total = selectEntries.length;
                document.getElementById('selectedTotal').textContent = total;
                updateSelectBadge();

                if (total === 0) {
                    container.innerHTML = `<div class="empty-category">🎯 还没有选择任何车辆<br>点击「添加车辆」从完整列表中选择</div>`;
                    return;
                }

                const carIndex = {};
                CAR_DATA.forEach(b => {
                    b.models.forEach(m => {
                        carIndex[b.brand + '|' + m.name] = { brand: b.brand, name: m.name };
                    });
                });

                let filtered = selectEntries.filter(e => {
                    if (categoryFilter !== 'all' && e.category !== categoryFilter) return false;
                    if (levelFilter !== 'all' && e.level !== levelFilter) return false;
                    if (driveFilter !== 'all' && e.drive !== driveFilter) return false;
                    if (metaFilter === 'meta' && !e.meta) return false;
                    if (metaFilter === 'other' && e.meta) return false;
                    if (highlightFilter === 'red' && e.highlight !== 'red') return false;
                    if (highlightFilter === 'yellow' && e.highlight !== 'yellow') return false;
                    if (highlightFilter === 'none' && e.highlight !== 'none') return false;
                    return true;
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="empty-category">🔍 没有匹配的车辆，试试调整筛选条件</div>`;
                    return;
                }

                const categoryGroups = {};
                CATEGORIES.forEach(cat => {
                    categoryGroups[cat] = {};
                    LEVELS.forEach(lv => {
                        categoryGroups[cat][lv] = [];
                    });
                });

                selectEntries.forEach(e => {
                    if (categoryFilter !== 'all' && e.category !== categoryFilter) return;
                    if (levelFilter !== 'all' && e.level !== levelFilter) return;
                    if (driveFilter !== 'all' && e.drive !== driveFilter) return;
                    if (metaFilter === 'meta' && !e.meta) return;
                    if (metaFilter === 'other' && e.meta) return;
                    if (highlightFilter === 'red' && e.highlight !== 'red') return;
                    if (highlightFilter === 'yellow' && e.highlight !== 'yellow') return;
                    if (highlightFilter === 'none' && e.highlight !== 'none') return;
                    const car = carIndex[e.brand + '|' + e.model];
                    if (!car) return;
                    const cat = e.category || '公路';
                    const lv = e.level || 'B';
                    if (categoryGroups[cat] && categoryGroups[cat][lv]) {
                        categoryGroups[cat][lv].push({ ...car, level: lv, category: cat, drive: e.drive || '四驱',
                            meta: e.meta || false, highlight: e.highlight || 'none' });
                    }
                });

                CATEGORIES.forEach(cat => {
                    const levelMap = categoryGroups[cat];
                    let totalInCat = 0;
                    LEVELS.forEach(lv => {
                        totalInCat += (levelMap[lv] || []).length;
                    });
                    if (totalInCat === 0) return;

                    const card = document.createElement('div');
                    card.className = 'category-card';

                    const header = document.createElement('div');
                    header.className = `category-header ${CAT_COLORS[cat] || 'cat-公路'}`;
                    header.innerHTML = `
                        <span>${CAT_ICONS[cat] || ''} ${cat}</span>
                        <span class="count-badge">${totalInCat}</span>
                    `;
                    header.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (expandedCategory) {
                            const overlay = document.getElementById('expandOverlay');
                            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('expanded'));
                            overlay.classList.remove('show');
                            document.body.style.overflow = '';
                            expandedCategory = null;
                            if (expandedCategory === cat) return;
                        }
                        toggleExpand(cat);
                    });
                    card.appendChild(header);

                    const body = document.createElement('div');
                    body.className = 'category-body';

                    LEVELS.forEach(lv => {
                        const cars = levelMap[lv] || [];
                        if (cars.length === 0) return;

                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'level-group';

                        const title = document.createElement('div');
                        title.className = 'level-group-title';
                        title.innerHTML = `<span>${LEVEL_NAMES[lv]}</span><span>${cars.length}</span>`;
                        groupDiv.appendChild(title);

                        const metaCars = cars.filter(c => c.meta === true);
                        const otherCars = cars.filter(c => c.meta === false);

                        const subGroups = [
                            { label: '🔴 META', cars: metaCars, type: 'meta' },
                            { label: '📋 Other', cars: otherCars, type: 'other' }
                        ];

                        subGroups.forEach(sg => {
                            if (sg.cars.length === 0) return;
                            const subGroup = document.createElement('div');
                            subGroup.className = 'sub-group';

                            const subTitle = document.createElement('div');
                            subTitle.className = 'sub-group-title';
                            subTitle.innerHTML = `<span>${sg.label}</span><span class="sub-count">${sg.cars.length}</span>`;
                            subGroup.appendChild(subTitle);

                            const subList = document.createElement('div');
                            subList.className = 'sub-group-cars';
                            sg.cars.forEach((car) => {
                                const item = createCarItem(car, lv, cat);
                                subList.appendChild(item);
                            });
                            subGroup.appendChild(subList);
                            groupDiv.appendChild(subGroup);
                        });

                        body.appendChild(groupDiv);
                    });

                    card.appendChild(body);
                    container.appendChild(card);
                });
            }

            function createCarItem(car, lv, cat) {
                const isMeta = car.meta === true;
                const isRed = car.highlight === 'red';
                const isYellow = car.highlight === 'yellow';

                let hlClass = '';
                if (isYellow) hlClass = 'highlight-yellow';
                else if (isRed) hlClass = 'highlight-red';

                const item = document.createElement('div');
                item.className = `select-car-item ${hlClass}`;
                item.dataset.brand = car.brand;
                item.dataset.model = car.name;
                item.dataset.level = lv;
                item.dataset.category = cat;
                item.dataset.meta = isMeta ? 'true' : 'false';
                item.dataset.highlight = car.highlight || 'none';

                const yearMatch = car.name.match(/^(\d{4})/);
                const year = yearMatch ? yearMatch[1] : '';
                const nameDisplay = car.name.replace(/^\d{4}\s*/, '');

                const driveTag =
                    `<span class="drive-tag drive-${car.drive || '四驱'}">${DRIVE_ICONS[car.drive || '四驱'] || '🔵'} ${car.drive || '四驱'}</span>`;

                let metaTag = '';
                if (isMeta) metaTag = `<span class="meta-tag">META</span>`;

                const removeBtn = isEditMode ?
                    `<button class="action-btn remove" data-action="remove" data-brand="${car.brand}" data-model="${car.name}" data-level="${lv}" data-category="${cat}" title="从此分类移除">✕</button>` :
                    '';

                const dragHandle = isEditMode ?
                    `<span class="drag-handle show" title="拖动排序">⠿</span>` :
                    `<span class="drag-handle">⠿</span>`;

                const hlToggleBtn = isEditMode ?
                    `<button class="action-btn" data-action="toggle-hl" data-brand="${car.brand}" data-model="${car.name}" data-level="${lv}" data-category="${cat}" title="切换高亮" style="color:#e94560;font-size:10px;font-weight:700;">${isRed ? '🔴' : isYellow ? '🟡' : '○'}</button>` :
                    '';

                const metaToggleBtn = isEditMode ?
                    `<button class="action-btn" data-action="toggle-meta" data-brand="${car.brand}" data-model="${car.name}" data-level="${lv}" data-category="${cat}" title="切换 META/Other" style="color:#e94560;font-size:9px;font-weight:700;">${isMeta ? 'M' : 'O'}</button>` :
                    '';

                item.innerHTML = `
                    <div class="car-left">
                        <span class="brand-icon">${car.brand}</span>
                        <span class="car-name">${year ? `<span class="year-text">${year}</span> ` : ''}${nameDisplay}</span>
                    </div>
                    <div class="car-tags-right">
                        ${driveTag}
                        ${metaTag}
                        ${hlToggleBtn}
                        ${metaToggleBtn}
                        ${removeBtn}
                        ${dragHandle}
                    </div>
                `;

                const removeAction = item.querySelector('[data-action="remove"]');
                if (removeAction) {
                    removeAction.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const brand = removeAction.dataset.brand;
                        const model = removeAction.dataset.model;
                        const level = removeAction.dataset.level;
                        const category = removeAction.dataset.category;
                        if (confirm(`确定从「${category} / ${LEVEL_NAMES[level]}」中移除「${brand} ${model}」吗？`)) {
                            removeFromSelect(brand, model, level, category);
                        }
                    });
                }

                const hlToggle = item.querySelector('[data-action="toggle-hl"]');
                if (hlToggle) {
                    hlToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const brand = hlToggle.dataset.brand;
                        const model = hlToggle.dataset.model;
                        const level = hlToggle.dataset.level;
                        const category = hlToggle.dataset.category;
                        toggleHighlight(brand, model, level, category);
                    });
                }

                const metaToggle = item.querySelector('[data-action="toggle-meta"]');
                if (metaToggle) {
                    metaToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const brand = metaToggle.dataset.brand;
                        const model = metaToggle.dataset.model;
                        const level = metaToggle.dataset.level;
                        const category = metaToggle.dataset.category;
                        toggleMeta(brand, model, level, category);
                    });
                }

                if (isEditMode) {
                    item.draggable = true;
                    item.addEventListener('dragstart', onDragStart);
                    item.addEventListener('dragend', onDragEnd);
                    item.addEventListener('dragover', onDragOver);
                    item.addEventListener('dragenter', onDragEnter);
                    item.addEventListener('dragleave', onDragLeave);
                    item.addEventListener('drop', onDrop);
                } else {
                    item.draggable = false;
                }

                return item;
            }

            // ============================================================
            //  添加弹窗
            // ============================================================
            function openAddModal() {
                document.getElementById('addSearchInput').value = '';
                document.querySelector('input[name="drive"][value="四驱"]').checked = true;
                document.querySelector('input[name="meta"][value="other"]').checked = true;
                document.querySelector('input[name="highlight"][value="none"]').checked = true;
                document.getElementById('addModal').classList.add('show');
                renderAddVehicleList('');
            }

            function closeAddModal() {
                document.getElementById('addModal').classList.remove('show');
            }

            function renderAddVehicleList(search) {
                const list = document.getElementById('addVehicleList');
                list.innerHTML = '';

                const allVehicles = [];
                CAR_DATA.forEach(b => {
                    b.models.forEach(m => {
                        allVehicles.push({ brand: b.brand, name: m.name });
                    });
                });

                const searchLower = search.toLowerCase();
                const filtered = allVehicles.filter(v =>
                    v.name.toLowerCase().includes(searchLower) ||
                    v.brand.toLowerCase().includes(searchLower)
                );

                filtered.sort((a, b) => {
                    const ya = parseInt(a.name.match(/^(\d{4})/)?.[1] || '0');
                    const yb = parseInt(b.name.match(/^(\d{4})/)?.[1] || '0');
                    return ya - yb;
                });

                const level = document.getElementById('addLevelSelect').value;
                const category = document.getElementById('addCategorySelect').value;
                const drive = document.querySelector('input[name="drive"]:checked')?.value || '四驱';
                const meta = document.querySelector('input[name="meta"]:checked')?.value === 'meta';
                const highlight = document.querySelector('input[name="highlight"]:checked')?.value || 'none';

                if (filtered.length === 0) {
                    list.innerHTML = `<div style="padding:20px;text-align:center;color:#8a9aa8;">没有找到匹配的车辆</div>`;
                    return;
                }

                filtered.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'v-item';

                    const alreadyAdded = selectEntries.some(e =>
                        e.brand === v.brand && e.model === v.name &&
                        e.level === level && e.category === category
                    );

                    const yearMatch = v.name.match(/^(\d{4})/);
                    const year = yearMatch ? yearMatch[1] : '';
                    const displayName = v.name.replace(/^\d{4}\s*/, '');

                    div.innerHTML = `
                        <div class="v-left">
                            <span class="v-brand">${v.brand}</span>
                            <span class="v-name">${year ? `${year} ` : ''}${displayName}</span>
                        </div>
                        ${alreadyAdded ? `<span class="v-added">✓ 已添加</span>` :
                          `<span class="v-add">＋</span>`}
                    `;

                    if (!alreadyAdded) {
                        const addSpan = div.querySelector('.v-add');
                        addSpan.addEventListener('click', () => {
                            const lv = document.getElementById('addLevelSelect').value;
                            const cat = document.getElementById('addCategorySelect').value;
                            const dv = document.querySelector('input[name="drive"]:checked')?.value || '四驱';
                            const mt = document.querySelector('input[name="meta"]:checked')?.value === 'meta';
                            const hl = document.querySelector('input[name="highlight"]:checked')?.value || 'none';
                            addToSelect(v.brand, v.name, lv, cat, dv, mt, hl);
                            renderAddVehicleList(document.getElementById('addSearchInput').value);
                        });
                    }

                    list.appendChild(div);
                });
            }

            // ============================================================
            //  Tab 切换
            // ============================================================
            function switchTab(tabId) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + tabId).classList.add('active');
                document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
                if (tabId === 'select') {
                    renderSelect();
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                loadStatus();
                loadSelect();

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchTab(btn.dataset.tab);
                    });
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    searchKeyword = e.target.value.trim();
                    renderMain();
                });

                document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove(
                        'active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        renderMain();
                    });
                });

                document.getElementById('resetBtn').addEventListener('click', resetAll);
                document.getElementById('exportBtn').addEventListener('click', exportMainCSV);
                document.getElementById('importBtn').addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
                document.getElementById('fileInput').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        importMainCSV(file);
                    }
                    e.target.value = '';
                });

                document.getElementById('selectExportBtn').addEventListener('click', exportSelectCSV);
                document.getElementById('selectImportBtn').addEventListener('click', () => {
                    document.getElementById('selectFileInput').click();
                });
                document.getElementById('selectFileInput').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        importSelectCSV(file);
                    }
                    e.target.value = '';
                });

                document.getElementById('clearAllSelect').addEventListener('click', clearAllSelect);

                document.getElementById('editToggleBtn').addEventListener('click', function() {
                    isEditMode = !isEditMode;
                    this.classList.toggle('active');
                    this.textContent = isEditMode ? '🔒 退出编辑' : '✏️ 编辑';
                    document.getElementById('editModeHint').textContent = isEditMode ?
                        '✏️ 编辑：拖动 ⠿ · ✕ 删除 · ○/🟡/🔴 切换高亮 · M/O 切换分类' :
                        '💡 开启编辑可删除/拖动/切换高亮或分类';
                    renderSelect();
                });

                document.getElementById('addCarFromAllBtn').addEventListener('click', openAddModal);

                document.getElementById('categoryFilterSelect').addEventListener('change', (e) => {
                    categoryFilter = e.target.value;
                    renderSelect();
                });
                document.getElementById('levelFilterSelect').addEventListener('change', (e) => {
                    levelFilter = e.target.value;
                    renderSelect();
                });
                document.getElementById('driveFilterSelect').addEventListener('change', (e) => {
                    driveFilter = e.target.value;
                    renderSelect();
                });
                document.getElementById('metaFilterSelect').addEventListener('change', (e) => {
                    metaFilter = e.target.value;
                    renderSelect();
                });
                document.getElementById('highlightFilterSelect').addEventListener('change', (e) => {
                    highlightFilter = e.target.value;
                    renderSelect();
                });

                document.getElementById('addSearchInput').addEventListener('input', (e) => {
                    renderAddVehicleList(e.target.value);
                });
                document.getElementById('addLevelSelect').addEventListener('change', () => {
                    renderAddVehicleList(document.getElementById('addSearchInput').value);
                });
                document.getElementById('addCategorySelect').addEventListener('change', () => {
                    renderAddVehicleList(document.getElementById('addSearchInput').value);
                });
                document.querySelectorAll('input[name="drive"]').forEach(el => {
                    el.addEventListener('change', () => {
                        renderAddVehicleList(document.getElementById('addSearchInput').value);
                    });
                });
                document.querySelectorAll('input[name="meta"]').forEach(el => {
                    el.addEventListener('change', () => {
                        renderAddVehicleList(document.getElementById('addSearchInput').value);
                    });
                });
                document.querySelectorAll('input[name="highlight"]').forEach(el => {
                    el.addEventListener('change', () => {
                        renderAddVehicleList(document.getElementById('addSearchInput').value);
                    });
                });

                document.getElementById('addCancelBtn').addEventListener('click', closeAddModal);

                renderMain();
                renderSelect();
                updateSelectBadge();
            });
        })();
    </script>
</body>
</html>
